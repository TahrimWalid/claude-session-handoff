name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: test
        shell: bash
        run: |
          python -m unittest discover -s tests > out.txt 2>&1 && exit 0
          python - <<'PY'
          import re
          text = open("out.txt", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?==+\n(?:FAIL|ERROR): )", text)
          for b in blocks[1:30]:
              msg = b.strip("=\n")[:3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::{msg}")
          print("::error::" + text[-300:].replace("\n", "%0A"))
          PY
          exit 1
